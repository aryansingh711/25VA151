<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixed Responsive Galley</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 70%;        
      margin: 0 auto;  
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
        width: 90%; 
      }
    }

    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: 1fr;
        width: 95%; 
      }
    }
  </style>
</head>
<body>
  <h1>Responsive Gallery</h1>
  <div class="gallery">
    <img src="https://picsum.photos/id/1015/600/400" alt="Sample 1">
    <img src="https://picsum.photos/id/1016/600/400" alt="Sample 2">
    <img src="https://picsum.photos/id/1020/600/400" alt="Sample 3">
    <img src="https://picsum.photos/id/1024/600/400" alt="Sample 4">
    <img src="https://picsum.photos/id/1035/600/400" alt="Sample 5">
    <img src="https://picsum.photos/id/1043/600/400" alt="Sample 6">
  </div>
</body>
</html>
